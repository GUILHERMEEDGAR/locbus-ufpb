<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="4"/>

  <!-- Pulse Circles (IoT / Real-time Signal) -->
  <circle cx="256" cy="110" r="45" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="3"/>
  <circle cx="256" cy="110" r="28" fill="none" stroke="rgba(16, 185, 129, 0.6)" stroke-width="4"/>
  <circle cx="256" cy="110" r="12" fill="#10b981"/>

  <!-- Bus Body Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Bus Chassis -->
    <rect x="136" y="160" width="240" height="240" rx="36" fill="url(#busGrad)"/>
    
    <!-- Windshield -->
    <rect x="160" y="188" width="192" height="88" rx="16" fill="#0f172a"/>
    <!-- Glass reflection line -->
    <path d="M 170 198 L 220 198 L 195 264 L 170 264 Z" fill="rgba(255, 255, 255, 0.15)"/>
    <path d="M 235 198 L 255 198 L 230 264 L 210 264 Z" fill="rgba(255, 255, 255, 0.08)"/>

    <!-- Headlights -->
    <circle cx="176" cy="326" r="16" fill="#fef08a"/>
    <circle cx="176" cy="326" r="24" fill="url(#glowGrad)"/>

    <circle cx="336" cy="326" r="16" fill="#fef08a"/>
    <circle cx="336" cy="326" r="24" fill="url(#glowGrad)"/>

    <!-- Grille / Sign Plate -->
    <rect x="216" y="318" width="80" height="16" rx="6" fill="#1e293b"/>
    <text x="256" y="331" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#60a5fa" text-anchor="middle" letter-spacing="1">UFPB</text>

    <!-- Bumper -->
    <rect x="156" y="364" width="200" height="18" rx="9" fill="#0b1120"/>

    <!-- Wheels -->
    <rect x="152" y="394" width="44" height="20" rx="6" fill="#020617"/>
    <rect x="316" y="394" width="44" height="20" rx="6" fill="#020617"/>
  </g>

  <!-- Route Line Dot -->
  <line x1="80" y1="440" x2="432" y2="440" stroke="#3b82f6" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="440" r="8" fill="#10b981"/>
</svg>
