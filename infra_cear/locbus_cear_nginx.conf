# Configuração de Proxy Reverso Nginx para o LocBUS no servidor CEAR/UFPB
# Subdomínio sugerido: locbus.cear.ufpb.br

server {
    listen 80;
    server_name locbus.cear.ufpb.br;
    # Redirecionamento forçado para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name locbus.cear.ufpb.br;

    # Certificados SSL (Let's Encrypt ou Certificado Institucional UFPB)
    ssl_certificate /etc/letsencrypt/live/locbus.cear.ufpb.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locbus.cear.ufpb.br/privkey.pem;

    # Configurações de segurança recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Roteamento para a aplicação LocBUS (Container Docker na porta 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRÍTICO PARA O STREAMING DO LOCBUS (Server-Sent Events / SSE):
        # Desativa buffers intermediários para que as atualizações do ônibus cheguem sem atraso
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
