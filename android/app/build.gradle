plugins {
    id 'com.android.application'
}

android {
    namespace 'br.edu.ufpb.locbus'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.6.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["appType"]

    productFlavors {
        passenger {
            dimension "appType"
            applicationId "br.edu.ufpb.locbus"
            manifestPlaceholders = [appName: "LocBUS"]
            buildConfigField "String", "APP_URL", "\"https://locbus-ufpb.onrender.com\""
            buildConfigField "boolean", "IS_TRACKER", "false"
        }
        tracker {
            dimension "appType"
            applicationId "br.edu.ufpb.locbus.tracker"
            manifestPlaceholders = [appName: "LocBUS Tracker"]
            buildConfigField "String", "APP_URL", "\"https://locbus-ufpb.onrender.com/tracker\""
            buildConfigField "boolean", "IS_TRACKER", "true"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            if (variant.flavorName == "tracker") {
                outputFileName = "LocBUS-Tracker-v${variant.versionName}.apk"
            } else {
                outputFileName = "LocBUS-v${variant.versionName}.apk"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}

