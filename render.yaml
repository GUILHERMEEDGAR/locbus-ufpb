services:
  - type: web
    name: locbus-ufpb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
